[project]
name = "peru-weather"
version = "0.1.0"
description = "Weather layer backend: fetches NOAA GFS fields, reprojects them to Web Mercator over Peru and serves compact grids."
requires-python = ">=3.11"
dependencies = [
  "eccodes>=2.39",
  "eccodeslib>=2.50.0.33",
  "fastapi>=0.115",
  "h5py>=3.12",
  "httpx>=0.27",
  "numpy>=2.1",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
