[project]
name = "goes-clouds"
version = "0.1.0"
description = "Builds the Peru cloud overlay (PNG + JSON) from NOAA GOES-19 ABI full-disk products."
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.12",
  "numpy>=2.1",
  "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
