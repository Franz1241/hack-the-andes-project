[project]
name = "illapa-risk-pipeline"
version = "0.1.0"
description = "Offline road graph, segmentation and static feature pipeline for the Illapa risk engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.0",
    "osmium>=4.0",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pymysql>=1.1",
    "rasterio>=1.4",
    "requests>=2.32",
    "shapely>=2.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
train = [
    "lightgbm>=4.5",
    "m2cgen>=0.10",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false
